name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install openpyxl
      - name: Repository guard (no household records, coordinates or GIZ reports)
        run: python scripts/check_repo.py
      - name: Data files match the workbook
        run: python scripts/build_data.py --check
      - name: Workbook test sheet matches the engine
        run: python scripts/check_workbook.py
      - run: npm ci
      - name: Engine, Python reference, wizard model and build tests
        run: npm test
      - name: The committed build matches the source
        run: |
          npm run build
          git status --porcelain -- index.html assets sw.js
          test -z "$(git status --porcelain -- index.html assets sw.js)" || (echo "index.html or assets/ is stale: run npm run build and commit the result" && exit 1)
